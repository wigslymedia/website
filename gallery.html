    <!-- Scripts -->
    <script>
        // Force lightbox positioning fix - override any CSS conflicts
        document.addEventListener('DOMContentLoaded', function() {
            const lightbox = document.getElementById('lightbox');
            if (lightbox) {
                // Override the click handler to ensure position is set
                const originalOpenLightbox = window.openLightboxByIndex;
                window.openLightboxByIndex = function(index) {
                    // Force position: fixed before opening
                    lightbox.style.setProperty('position', 'fixed', 'important');
                    lightbox.style.setProperty('top', '0', 'important');
                    lightbox.style.setProperty('left', '0', 'important');
                    lightbox.style.setProperty('width', '100%', 'important');
                    lightbox.style.setProperty('height', '100%', 'important');
                    
                    // Call original function if it exists
                    if (originalOpenLightbox) {
                        originalOpenLightbox(index);
                    }
                };
            }
        });
    </script>
